<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Galaga for the Atari Lynx</title>
<style>
  body { margin: 0; background: #111; color: #ccc; font: 14px/1.4 system-ui, sans-serif; text-align: center; }
  #box { width: min(100vw, 640px); height: min(62.5vw, 400px); margin: 16px auto; }
  a { color: #8cf; }
</style>
</head>
<body>
<div id="box"><div id="game"></div></div>
<p>Galaga for the Atari Lynx, in the browser with <a href="https://emulatorjs.org/">EmulatorJS</a>.<br>
Arrow keys move, Z fires (the gear menu shows all keys).<br>
<a href="https://github.com/Shadester/galagas/tree/master/lynx">Source</a> · <a href="../">All versions</a></p>
<script>
  EJS_player = '#game';
  EJS_core = 'lynx';
  EJS_gameUrl = 'galaga.lnx';
  EJS_gameName = 'Galaga';
  EJS_pathtodata = 'https://cdn.emulatorjs.org/stable/data/';
  EJS_startOnLoaded = true;
</script>
<script src="https://cdn.emulatorjs.org/stable/data/loader.js"></script>
</body>
</html>
